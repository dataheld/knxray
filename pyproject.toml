[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pytest", "syrupy"]

[project]
name = "knxray"
version = "0.1.0"
description = "Readable JSON diffs for KNX ETS project files"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = ["xknxproject"]

[project.scripts]
knxray = "knxray._cli:main"

[project.urls]
Documentation = "https://knxray.maxheld.de"
Repository = "https://github.com/dataheld/knxray"
Issues = "https://github.com/dataheld/knxray/issues"
